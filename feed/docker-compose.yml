services:
  blog:
    image: nginx:alpine
    container_name: blog
    restart: unless-stopped
    volumes:
      - /data/stacks/feed/html:/usr/share/nginx/html:ro
      - /data/stacks/feed/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
