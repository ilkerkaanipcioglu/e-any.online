# Content Hub Nginx - multi-site support via $host
# Serves /data/stacks/feed/html/<site>/blog/

# Map domain to site directory
map $host $site_dir {
    hostnames;
    default              /usr/share/nginx/html/agentandbot;
    ~^(www\.)?agentandbot\.com  /usr/share/nginx/html/agentandbot;
    ~^(www\.)?e-any\.online     /usr/share/nginx/html/e-any;
    ~^(www\.)?harezmi\.com      /usr/share/nginx/html/harezmi;
    ~^(www\.)?eny\.com\.tr      /usr/share/nginx/html/eny;
    ~^blog\.                     /usr/share/nginx/html/agentandbot;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Health check
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Blog listing
    location = /blog {
        return 302 /blog/;
    }
    location = /feed {
        return 302 /blog/;
    }

    location /blog/ {
        alias $site_dir/blog/;
        try_files $uri $uri.html $uri/ index.html =404;
    }

    location /feed/ {
        alias $site_dir/blog/;
        try_files $uri $uri.html $uri/ index.html =404;
    }

    # JSON feed
    location /feed.json {
        alias $site_dir/../feed.json;
    }
}
