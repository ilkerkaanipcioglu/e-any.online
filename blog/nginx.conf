server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blog listing - both /blog and /blog/
    location = /blog {
        return 302 /blog/;
    }

    location /blog/ {
        try_files $uri $uri.html $uri/ /blog/index.html =404;
    }

    # Health check
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
